[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hvdc-supervision-lab"
version = "0.1.0"
description = "Training-only two-terminal HVDC supervisory software, simulation, OPC UA and verification lab"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "asyncua==2.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "coverage>=7.6,<8",
]

[project.scripts]
hvdc-lab = "hvdc_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["hvdc_lab"]
omit = ["*/opcua_gateway.py", "*/cli.py", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 75
